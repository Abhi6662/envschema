[tool.poetry]
name = "envschema"
version = "0.1.0"
description = "Zero-dependency typed .env validator CLI and library"
authors = ["Abhishek Mandloi <163866821+Abhi6662@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Abhi6662/envschema"
repository = "https://github.com/Abhi6662/envschema"
keywords = ["python", "configuration", "dotenv", "validation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
packages = [{include = "envschema", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"

[tool.poetry.scripts]
envschema = "envschema.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
